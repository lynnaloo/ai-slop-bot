steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/ai-slop-api:$COMMIT_SHA
      - ./backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/ai-slop-api:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ai-slop-api
      - --image=gcr.io/$PROJECT_ID/ai-slop-api:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=1
      - --memory=2Gi

images:
  - gcr.io/$PROJECT_ID/ai-slop-api:$COMMIT_SHA
