apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-slop-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/ai-slop-api:latest
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: GEMINI_MODEL
              value: gemini-3.1-pro-preview
            - name: PORT
              value: "8080"
          envFrom: []
          # Add secret references here:
          # - name: GEMINI_API_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: gemini-api-key
          #       key: latest
