[project]
name = "ai-slop-bot"
version = "0.1.0"
description = "AI Slop Detector — scores content for AI-generated slop using Gemini"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
